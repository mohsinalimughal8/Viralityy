<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Viralityy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;background:var(--bg);background-image:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(99,102,241,.14) 0%,transparent 70%)}
.auth-wrap{width:100%;max-width:400px}
.auth-header{text-align:center;margin-bottom:2rem}
.auth-header h1{font-family:'DM Serif Display',serif;font-size:1.7rem;font-weight:400;margin:.75rem 0 .4rem;letter-spacing:-.02em}
.auth-header p{font-size:.82rem;color:var(--text2)}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2rem}
.auth-footer{text-align:center;margin-top:1.25rem;font-size:.79rem;color:var(--text2)}
.auth-footer a{color:#a5b4fc}
.forgot{font-size:.75rem;color:#a5b4fc;text-align:right;margin-top:-8px;margin-bottom:1rem;display:block}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:40px}
.pw-toggle{position:absolute;right:11px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text3);background:none;border:none;padding:4px}
.pw-toggle:hover{color:var(--text2)}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-header">
    <a href="index.html" class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg></div>Viralityy</a>
    <h1>Welcome back</h1>
    <p>Sign in to your Viralityy account</p>
  </div>
  <div class="auth-card">
    <div id="err" class="error-msg">Invalid email or password. Please try again.</div>
    <button class="btn btn-google" onclick="handleGoogle()" style="margin-bottom:1rem">
      <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <div class="divider-text">or sign in with email</div>
    <div class="input-wrap">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="input-wrap">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
        <button class="pw-toggle" onclick="togglePw('password',this)" tabindex="-1">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <a href="reset.html" class="forgot">Forgot password?</a>
    <button class="btn btn-primary" onclick="handleLogin()">Sign in →</button>
    <p style="font-size:.72rem;color:var(--text3);text-align:center;margin-top:1rem">By signing in you agree to our <a href="terms.html" style="color:#a5b4fc">Terms</a> and <a href="privacy.html" style="color:#a5b4fc">Privacy Policy</a></p>
  </div>
  <div class="auth-footer">Don't have an account? <a href="signup.html">Create one free →</a></div>
</div>
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  btn.style.color = isText ? 'var(--text3)' : '#a5b4fc';
}
function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const err   = document.getElementById('err');
  err.classList.remove('show');
  if (!email || !pass) { err.textContent = 'Please enter your email and password.'; err.classList.add('show'); return; }
  // Simulate: any valid email format → success
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && pass.length >= 6) {
    window.location.href = 'viralityy-prototype.html';
  } else {
    err.textContent = pass.length < 6 ? 'Password must be at least 6 characters.' : 'Invalid email address.';
    err.classList.add('show');
  }
}
function handleGoogle() { window.location.href = 'viralityy-prototype.html'; }
document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
